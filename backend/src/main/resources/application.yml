server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/k8s_config?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      INDENT_OUTPUT: true

mybatis:
  type-aliases-package: com.example.k8sconfig.entity
  mapper-locations: classpath*:mapper/*.xml

kubernetes:
  client:
    config-file: "/home/ubuntu/.kube/config"
    namespace: default
