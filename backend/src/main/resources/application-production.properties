server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/k8s_config?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.serialization.INDENT_OUTPUT=true

mybatis-plus.type-aliases-package=com.k8smaster.domain.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

kubernetes.client.config-file=/home/ubuntu/.kube/config
kubernetes.client.namespace=default
